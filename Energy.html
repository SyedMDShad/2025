<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sako 2KW</title>
<style>
:root{--bg:#0b0e14;--card:#141a26;--card2:#1a2231;--line:#232d40;--txt:#f2f5fa;--mut:#8b96ab;--gold:#f5c451;--grn:#34d399;--blu:#60a5fa;--org:#fb923c;--red:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:400px;margin:0 auto;padding:12px 12px 20px;width:100%}
/* ---- network banner ---- */
html{overflow-x:hidden}
.netb{position:sticky;top:0;z-index:60;margin:0 auto 10px;width:100%;max-width:400px;padding:8px 14px;font-size:11px;font-weight:700;text-align:center}
.netb.warn{background:rgba(251,146,60,.14);color:var(--org);border-bottom:1px solid rgba(251,146,60,.3)}
.netb.err{background:rgba(248,113,113,.14);color:var(--red);border-bottom:1px solid rgba(248,113,113,.35)}
.netb.ok{background:rgba(52,211,153,.10);color:var(--grn);border-bottom:1px solid rgba(52,211,153,.25)}
/* ---- pills ---- */
.pill{font-size:10px;font-weight:800;padding:5px 10px;border-radius:99px;letter-spacing:.06em;white-space:nowrap}
.pill.on{background:rgba(52,211,153,.22);color:var(--grn);border:1px solid rgba(52,211,153,.7);box-shadow:0 0 12px rgba(52,211,153,.25)}
.pill.off{background:rgba(248,113,113,.22);color:var(--red);border:1px solid rgba(248,113,113,.7);box-shadow:0 0 12px rgba(248,113,113,.25)}
.pill.warn{background:rgba(251,146,60,.15);color:var(--org);border:1px solid rgba(251,146,60,.4)}
.pill.wait{background:rgba(139,150,171,.15);color:var(--mut);border:1px solid rgba(139,150,171,.35)}
/* ---- buttons ---- */
.icobtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;cursor:pointer}
.icobtn.sm{width:30px;height:30px;font-size:14px;border-radius:10px}
.btn{padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:800;font-size:13px;cursor:pointer}
.btn.gold{background:rgba(245,196,81,.15);border-color:rgba(245,196,81,.5);color:var(--gold)}
.btn.ghost{background:none}
.testbtn{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:700;font-size:11px;cursor:pointer;margin-left:6px}
/* ---- hero ---- */
.herotop{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.hctl{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hrow{display:flex;align-items:center;gap:6px}
.hctl small{color:var(--mut);font-size:10px;white-space:nowrap}
.bel{position:relative}
.hero{background:linear-gradient(160deg,#1b2334,#101623);border:1px solid var(--line);border-radius:20px;padding:12px 16px 10px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,rgba(245,196,81,.22),transparent 70%);pointer-events:none}
.hero .lbl{font-size:10px;letter-spacing:.14em;color:var(--mut);font-weight:800}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:0;transition:color .3s}
.hero .big small{font-size:14px;color:var(--mut);font-weight:600}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:9px 0 3px}
.g4i{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center}
.g4i small{display:block;color:var(--mut);font-size:8.5px;margin-bottom:3px;letter-spacing:.02em}
.g4i b{font-size:12px;transition:color .3s}
.g4i .ag{display:block;color:var(--mut);font-size:8px;margin-top:2px;min-height:9px;font-weight:600}
/* ---- reference curve image ---- */
.refimg{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin-top:8px;background:#fff;display:block}
/* ---- flow ---- */
.flowcard{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:12px;padding:10px 6px 4px}
.flowcard svg{width:100%;height:auto;display:block}
.fnode{font-size:9px;fill:var(--mut);font-weight:700;letter-spacing:.05em}
.fval{font-size:13px;fill:var(--txt);font-weight:800}
.fline{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 7;animation:dash 1s linear infinite}
.fline.idle{animation:none;opacity:.18;stroke-dasharray:none}
.fline.rev{animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-14}}
/* ---- cards ---- */
.today{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.today .h{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--mut);margin-bottom:10px}
.trow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.trow:first-of-type{border-top:0}
.trow span{color:var(--mut)}.trow b{font-weight:800;text-align:right;transition:color .3s}
.trow b.good{color:var(--grn)}.trow b.gold{color:var(--gold)}.trow b.org{color:var(--org)}.trow b.red{color:var(--red)}
canvas.chart{width:100%;height:auto;margin-top:8px;border-radius:10px}
.foot{display:flex;justify-content:space-between;color:var(--mut);font-size:10px;padding:14px 4px 4px}
.foot .cname{color:var(--txt)}
/* ---- bar ---- */
.bar{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s,background .5s}
/* ---- big stat ---- */
.bigstat{display:flex;align-items:baseline;gap:6px}
.bigstat b{font-size:34px;font-weight:800;letter-spacing:-.03em}
.bigstat small{color:var(--mut);font-size:12px;font-weight:700}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv2 .k{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.kv2 .k small{display:block;color:var(--mut);font-size:9px;margin-bottom:3px;letter-spacing:.03em}
.kv2 .k b{font-size:15px;font-weight:800}
/* ---- range segments ---- */
.hseg{display:flex;gap:6px;margin:10px 0 4px}
.hsegbtn{flex:1;padding:8px 4px;border-radius:8px;border:1px solid #2a3550;background:#131b2b;color:var(--mut);font:700 11px system-ui;cursor:pointer}
.hsegbtn.on{background:rgba(245,196,81,.14);color:var(--gold);border-color:var(--gold)}
/* ---- tabs ---- */
.pane{display:none}
.pane.on{display:block;animation:paneIn .28s ease}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:400px;display:flex;background:#0f1522;border-top:1px solid #232c44;z-index:40}
.tabbtn{flex:1;background:none;border:none;color:var(--mut);font:700 10px system-ui;padding:8px 0 10px;cursor:pointer;transition:color .2s,border-color .2s;line-height:1.15}
.tabbtn .ic{display:block;font-size:16px;margin-bottom:2px}
.tabbtn.on{color:var(--gold);border-top:2px solid var(--gold)}
/* ---- forms ---- */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.sheet h3{font-size:12px;letter-spacing:.08em;color:var(--gold);margin:14px 0 8px}
.sheet h3:first-child{margin-top:0}
label{display:block;font-size:11px;color:var(--mut);margin:9px 0 4px;font-weight:600}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--txt);font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.srow{display:flex;gap:8px;margin-top:14px}
.srow .btn{flex:1}
/* ---- forecast table ---- */
.fcrow{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:4px;padding:7px 0;border-top:1px solid var(--line);font-size:12px;align-items:center}
.fcrow:first-of-type{border-top:0}
.fcrow.head{color:var(--mut);font-size:10px;font-weight:800;letter-spacing:.05em}
.fcrow span{color:var(--mut)}
.fcrow b{text-align:right;font-weight:800}
/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.open{display:flex}
.modal .sheet{max-height:85vh;overflow:auto;max-width:430px;width:100%;position:static;box-shadow:none}
.nitem{display:flex;gap:9px;padding:9px 2px;border-top:1px solid var(--line);font-size:12px}
.nitem:first-of-type{border-top:0}
.nitem small{display:block;color:var(--mut);font-size:10px;margin-top:1px}
#expImg{max-width:100%;border-radius:10px;border:1px solid var(--line)}
#err{display:none;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:var(--red);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:10px}
.note{color:var(--mut);font-size:9.5px;display:block;margin-top:6px;line-height:1.45}
/* ---- V10 · glassy premium ---- */
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(620px 420px at 85% -5%,rgba(245,196,81,.10),transparent 60%),radial-gradient(520px 380px at -10% 30%,rgba(52,211,153,.07),transparent 60%),radial-gradient(520px 420px at 110% 78%,rgba(96,165,250,.08),transparent 60%)}
.wrap{position:relative;z-index:1}
.hero{background:linear-gradient(165deg,rgba(43,57,84,.62),rgba(15,21,34,.72));backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-color:rgba(148,163,184,.20);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 10px 30px rgba(0,0,0,.35)}
.today,.flowcard,.sheet{background:linear-gradient(165deg,rgba(36,48,70,.52),rgba(16,22,35,.64));backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-color:rgba(148,163,184,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 26px rgba(0,0,0,.32)}
.tabbar{background:rgba(12,17,29,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.g4i,.kv2 .k{background:rgba(10,14,21,.52);border-color:rgba(148,163,184,.14)}
.fcrow.head,.hsegbtn{border-color:rgba(148,163,184,.18)}

@keyframes spinIco { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.spinning { animation: spinIco 0.7s linear infinite !important; }
.testbtn.active { background: var(--gold) !important; color: #000 !important; font-weight: 700; }


/* ---- V13.1 · SAKO 2KW inverter-app layout ---- */
.hbar{display:flex;justify-content:space-between;align-items:center;margin:0 2px 4px}
.hbrand{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.16em}
.hbrand b{font-weight:800;color:var(--txt)}
.hbrand small{font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--grn)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px rgba(52,211,153,.9);animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.hright{display:flex;align-items:center;gap:6px}
.hright small{color:var(--mut);font-size:10px;font-weight:700;margin-right:2px}
.hsub{display:block;font-size:10px;font-weight:700;color:var(--mut);min-height:14px;margin:0 4px 2px}
.io-row{display:flex;justify-content:space-around;align-items:flex-end;padding:8px 28px 6px}
.io{display:flex;flex-direction:column;gap:4px}
.io-lbl{font-size:11px;font-weight:800;letter-spacing:.05em}
.io b{font-size:27px;font-weight:800;letter-spacing:-.03em}
.flowcard.v13{margin-top:4px;padding:6px 8px 4px;border-radius:24px;border-color:rgba(148,163,184,.20)}
.ctr-t{font-size:9px;font-weight:700;fill:var(--mut)}
.ctr-own{font-size:9px;font-weight:800;fill:var(--gold)}
.nicon.pv{color:#f5c451}
.ncirc{fill:url(#ngrad);stroke:#2c3648;stroke-width:1.5;transition:stroke .3s}
.froute{fill:none;stroke:#252c3b;stroke-width:2}
.fpulse{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:16 240;animation:flow 2.6s linear infinite}
.fpulse.idle{display:none}
.fpulse.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-256}}
.nicon{color:rgba(255,255,255,.92)}
.ndc{font-size:11px;font-weight:800;fill:var(--txt);letter-spacing:.06em}
.dval{font-size:17px;fill:var(--txt);font-weight:800;letter-spacing:-.01em;paint-order:stroke;stroke:#10151f;stroke-width:3.5px}
.dsub{font-size:9px;fill:var(--mut);font-weight:700;paint-order:stroke;stroke:#10151f;stroke-width:3px}
.dtiny{font-size:7.5px;fill:#77839a;font-weight:600;paint-order:stroke;stroke:#10151f;stroke-width:2.5px}
.battlbl{font-size:8px;letter-spacing:.22em;fill:rgba(255,255,255,.55);font-weight:800}
.battpct{font-size:40px;font-weight:800;fill:#fff;letter-spacing:-.02em}
.battsub{font-size:9px;fill:rgba(255,255,255,.8);font-weight:600}
.battpilltxt{font-size:10px;font-weight:800;fill:#fff}
.downtxt{font-size:9px;font-weight:800;fill:var(--gold);letter-spacing:.03em}
.ghrstxt{font-size:8.5px;font-weight:700;fill:var(--mut)}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div id="err"></div>

  <!-- ================= TAB 1 · HOME (clean) ================= -->
            <div id="panelHome" class="pane on">
    <div class="hbar">
      <div class="hbrand"><span class="pulse"></span><b>SAKO 2KW</b><small>· LIVE</small></div>
      <div class="hright">
        <small id="clock">--:--</small>
        <button class="icobtn sm" id="btnSync" title="Refresh">↻</button>
        <button class="icobtn sm" id="btnSet" title="Settings">⚙</button>
      </div>
    </div>
    <small id="hSub" class="hsub">&nbsp;</small>

    <div class="io-row">
      <div class="io"><small class="io-lbl" id="mainLbl" style="color:#34d399">Main Grid</small><b id="ioMain" style="color:#34d399">--</b></div>
      <div class="io"><small class="io-lbl" style="color:var(--mut)">Today (Main)</small><b id="ioToday" style="color:#f5c451">--</b></div>
    </div>

    <div class="flowcard v13">
      <svg viewBox="0 0 340 400">
        <defs>
          <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(245,196,81,.20)"/>
            <stop offset="100%" stop-color="rgba(245,196,81,0)"/>
          </radialGradient>
          <radialGradient id="ngrad" cx="50%" cy="38%" r="75%">
            <stop offset="0%" stop-color="#1e2738"/>
            <stop offset="100%" stop-color="#121722"/>
          </radialGradient>
        </defs>
        <!-- static routing (balanced: equal top/bottom reach) -->
        <path class="froute" d="M52,68 L52,160 L151,160"/>
        <path class="froute" d="M288,68 L288,160 L189,160"/>
        <path class="froute" d="M52,282 L52,188 L151,188"/>
        <path class="froute" d="M288,282 L288,188 L189,188"/>
        <!-- animated flow pulses -->
        <path id="fpGrid" class="fpulse idle" d="M52,68 L52,160 L151,160" stroke="#60a5fa"/>
        <path id="fpSol" class="fpulse idle" d="M288,68 L288,160 L189,160" stroke="#f5c451"/>
        <path id="fpBat" class="fpulse idle" d="M52,282 L52,188 L151,188" stroke="#34d399"/>
        <path id="fpLoad" class="fpulse idle" d="M288,282 L288,188 L189,188" stroke="#fb923c"/>

        <!-- CENTER · inverter icon (balanced between all 4 nodes) -->
        <circle cx="170" cy="174" r="62" fill="url(#cglow)"/>
        <g transform="translate(170,174)">
          <rect x="-19" y="-24" width="38" height="48" rx="7" fill="#10151f" stroke="#f5c451" stroke-width="2"/>
          <rect x="-12" y="-16" width="24" height="15" rx="2.5" fill="rgba(52,211,153,.10)" stroke="rgba(148,163,184,.55)" stroke-width="1.4"/>
          <circle cx="-6.5" cy="-8.5" r="1.7" fill="#34d399"/>
          <path d="M4.5,-13.5 L1.5,-8.5 L3.5,-8.5 L3,-5 L6.5,-10 L4.5,-10 Z" fill="#f5c451"/>
          <circle cx="-9" cy="7" r="2.3" fill="none" stroke="rgba(148,163,184,.7)" stroke-width="1.3"/>
          <circle cx="0" cy="7" r="2.3" fill="none" stroke="rgba(148,163,184,.7)" stroke-width="1.3"/>
          <circle cx="9" cy="7" r="2.3" fill="none" stroke="rgba(148,163,184,.7)" stroke-width="1.3"/>
          <line x1="-4" y1="15" x2="4" y2="15" stroke="rgba(148,163,184,.5)" stroke-width="1.4" stroke-linecap="round"/>
        </g>
        <text x="170" y="216" text-anchor="middle" class="ctr-t"><tspan id="gOnA" fill="#34d399" font-weight="800">--</tspan><tspan> · </tspan><tspan id="gOnB" fill="#f87171" font-weight="800">--</tspan></text>
        <text id="gCuts" x="170" y="230" text-anchor="middle" class="ctr-t"></text>
        <text id="dOwn" x="170" y="244" text-anchor="middle" class="ctr-own"></text>

        <!-- TOP-LEFT · GRID (grid→inverter) -->
        <circle id="nGrid" class="ncirc" cx="52" cy="40" r="26"/>
        <g class="nicon" transform="translate(52,40)">
          <path d="M2.5,-10 L-5.5,1.5 L-1.5,1.5 L-2.5,10 L5.5,-1.5 L1.5,-1.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
        </g>
        <text id="dGrid" x="52" y="88" text-anchor="middle" class="dval">--</text>
        <text id="dGridA" x="52" y="103" text-anchor="middle" class="dtiny"></text>
        <text id="dGridD" x="52" y="114" text-anchor="middle" class="dtiny"></text>
        <text id="dGridP" x="52" y="125" text-anchor="middle" class="dtiny"></text>

        <!-- TOP-RIGHT · PV (sun, yellow) -->
        <circle id="nPv" class="ncirc" cx="288" cy="40" r="26"/>
        <g class="nicon pv" transform="translate(288,40)">
          <circle r="4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="0" y1="-7.5" x2="0" y2="-10.5"/>
            <line x1="0" y1="7.5" x2="0" y2="10.5"/>
            <line x1="-7.5" y1="0" x2="-10.5" y2="0"/>
            <line x1="7.5" y1="0" x2="10.5" y2="0"/>
            <line x1="-5.3" y1="-5.3" x2="-7.4" y2="-7.4"/>
            <line x1="5.3" y1="5.3" x2="7.4" y2="7.4"/>
            <line x1="-5.3" y1="5.3" x2="-7.4" y2="7.4"/>
            <line x1="5.3" y1="-5.3" x2="7.4" y2="-7.4"/>
          </g>
        </g>
        <text id="dPv" x="288" y="88" text-anchor="middle" class="dval">--</text>
        <text id="dPvA" x="288" y="103" text-anchor="middle" class="dtiny"></text>
        <text id="dPvD" x="288" y="114" text-anchor="middle" class="dtiny"></text>
        <text id="dPvP" x="288" y="125" text-anchor="middle" class="dtiny"></text>

        <!-- BOTTOM-LEFT · BATTERY -->
        <circle id="nBat" class="ncirc" cx="52" cy="308" r="26"/>
        <g class="nicon" transform="translate(52,308)">
          <rect x="-11.5" y="-7" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <rect x="7.8" y="-3.5" width="3.2" height="7" rx="1.1" fill="currentColor"/>
          <rect x="-8.5" y="-4" width="3.6" height="8" rx="1" fill="currentColor"/>
          <rect x="-3.6" y="-4" width="3.6" height="8" rx="1" fill="currentColor"/>
          <rect x="1.3" y="-4" width="3.6" height="8" rx="1" fill="currentColor"/>
        </g>
        <text id="dBatt" x="52" y="356" text-anchor="middle" class="dval">--</text>
        <text id="dBattA" x="52" y="371" text-anchor="middle" class="dtiny"></text>
        <text id="dBattD" x="52" y="382" text-anchor="middle" class="dtiny"></text>
        <text id="dBattP" x="52" y="393" text-anchor="middle" class="dtiny"></text>

        <!-- BOTTOM-RIGHT · LOAD (home with light + fan) -->
        <circle id="nLoad" class="ncirc" cx="288" cy="308" r="26"/>
        <g class="nicon" transform="translate(288,308)">
          <path d="M-9,0.5 L0,-8.5 L9,0.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M-6.5,-0.5 L-6.5,8.5 L6.5,8.5 L6.5,-0.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="-3" cy="2.6" r="2.1" fill="none" stroke="currentColor" stroke-width="1.3"/>

<!-- ================= MODAL: SETTINGS & CALIBRATION ================= -->

  <div class="sheet">

      <button type="button" class="testbtn qSoc" data-v="20" style="flex:1;justify-content:center;padding:10px 0">20%</button>

    <div class="srow"><a class="btn gold" id="expA" download="sako.jpg" style="text-decoration:none;text-align:center">Save JPEG</a><button class="btn ghost" id="btnExClose">Close</button></div>

<script>
window.onerror=function(m,s,l,c,e){
  try{
    var el=document.getElementById("err");
    if(el){el.style.display="block";el.textContent="APP: "+m+" (line "+l+")";}
  }catch(x){}
  return false;
};

// ============================ 1 · CONFIG & MAPPINGS ============================
const APP_VER=45,APP_VER_MAJOR="13.4",APP_NAME="Sako 2KW";
const E={
  grid:"binary_sensor.energy_mate_v4_grid_present",
  solP:"sensor.energy_mate_v4_pv_estimated_power",chP:"sensor.energy_mate_v4_battery_charge_power",disP:"sensor.energy_mate_v4_battery_discharge_power",
  soc:"sensor.energy_mate_v4_battery_estimated_soc",battA:"sensor.energy_mate_v4_battery_current",
  mainD:"sensor.energy_mate_v4_main_daily",solD:"sensor.energy_mate_v4_pv_daily",inD:"sensor.energy_mate_v4_input_daily",outD:"sensor.energy_mate_v4_output_daily",
  bChD:"sensor.energy_mate_v4_battery_charge_daily",bDisD:"sensor.energy_mate_v4_battery_discharge_daily",
  bChSolD:"sensor.energy_mate_v4_battery_charge_solar_daily",bChGrD:"sensor.energy_mate_v4_battery_charge_grid_daily",
  pvPeakD:"sensor.energy_mate_v4_pv_peak_today",onH:"sensor.energy_mate_v4_grid_on_today",offH:"sensor.energy_mate_v4_grid_off_today",outN:"sensor.energy_mate_v4_grid_outages_today",
  ovh:"sensor.energy_mate_v4_inverter_overhead_power",ownUse:"sensor.energy_mate_v4_inverter_own_use",
  pkMainW:"sensor.energy_mate_v4_peak_main_w",pkMainT:"sensor.energy_mate_v4_peak_main_time",
  pkInW:"sensor.energy_mate_v4_peak_in_w",pkInT:"sensor.energy_mate_v4_peak_in_time",
  pkOutW:"sensor.energy_mate_v4_peak_out_w",pkOutT:"sensor.energy_mate_v4_peak_out_time",
  pkPvT:"sensor.energy_mate_v4_peak_pv_time",
  pkChW:"sensor.energy_mate_v4_peak_ch_a",pkChT:"sensor.energy_mate_v4_peak_ch_time",
  pkDisW:"sensor.energy_mate_v4_peak_dis_a",pkDisT:"sensor.energy_mate_v4_peak_dis_time",
  siteLat:"input_number.energy_final_site_lat",siteLon:"input_number.energy_final_site_lon",
  arrayP:"sensor.energy_mate_v4_effective_pv_array_power"
};
const R={
  mp:"sensor.baasaar_mein_laain_power",ma:"sensor.baasaar_mein_laain_current",mv:"sensor.baasaar_mein_laain_voltage",
  ip:"sensor.20a_charging_line_power",ia:"sensor.20a_charging_line_current",iv:"sensor.20a_charging_line_voltage",
  op:"sensor.16a_output_line_power",oa:"sensor.16a_output_line_current",ov:"sensor.16a_output_line_voltage"
};

const $=id=>document.getElementById(id);
const fmt=(v,d=0)=>Number.isFinite(v)?v.toLocaleString([],{maximumFractionDigits:d,minimumFractionDigits:d}):"0";
const kwh=v=>Number.isFinite(v)?fmt(v,1)+" Unit":"0.0 Unit";
const kw=v=>Number.isFinite(v)?(Math.abs(v)>=1000?(v/1000).toLocaleString([],{maximumFractionDigits:2})+"kW":fmt(v,0)+"W"):fmt(v,0)+"W";
const kwh3=v=>Number.isFinite(v)?fmt(v,1):"0.0";
const st=id=>(ALL[id]?ALL[id].state:"");
const num=id=>{const v=ALL[id]?+ALL[id].state:NaN;return Number.isFinite(v)?v:NaN};

// Local storage and settings cache
let SETTINGS = {
  battery_soc: 85,
  battery_voltage: 13.5,
  solar_mode: "auto",
  manual_solar_watts: 320
};

try {
  const ls = JSON.parse(localStorage.getItem("sako_user_settings") || "{}");
  Object.assign(SETTINGS, ls);
} catch(e){}

let ALL = {};
let RUN = {
  g: true, mp: 125, ip: 0, op: 125, pv: 0, ch: 0, dis: 0,
  soc: SETTINGS.battery_soc, amps: 0, ia: NaN, oa: NaN
};
let TOD = { grid: 0.35, in: 0.05, out: 0.42, pv: 0.65, ch: 0.38, dis: 0.02 };
let CFG_RATE = 15.00;
let CFG_SOL_RATE = 15.00;

function setSub(txt,col){
  try{const el=$("hSub");if(el){el.textContent=txt;el.style.color=col||"#8b96ab"}}catch(e){}
}

// ============================ 2 · REAL-TIME SYNC ============================
let syncBusy = false;
async function sync(forceVisual=false){
  if(syncBusy && !forceVisual) return;
  syncBusy = true;
  
  const syncBtn = $("btnSync");
  if(forceVisual && syncBtn) syncBtn.classList.add("spinning");

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4500);
    
    const res = await fetch("/api/states", {
      signal: controller.signal,
      cache: "no-store",
      headers: { "Accept": "application/json" }
    });
    clearTimeout(timeoutId);

    if(res.ok){
      const data = await res.json();
      ALL = {};
      for(const item of data) {
        ALL[item.entity_id] = item;
      }
      renderAll();
    } else {
      throw new Error("HTTP " + res.status);
    }
  } catch(err) {
    renderAll();
  } finally {
    syncBusy = false;
    if(syncBtn) syncBtn.classList.remove("spinning");
  }
}

// ============================ 3 · POWER MODEL ============================
function computePower(){
  const _mp = num(R.mp), _ip = num(R.ip), _op = num(R.op);
  const mp = Number.isFinite(_mp) ? _mp : RUN.mp;
  const ipRaw = Number.isFinite(_ip) ? _ip : RUN.ip;
  const op = Number.isFinite(_op) ? _op : RUN.op;

  const g = (st(E.grid) === "on") || (ipRaw > 10) || (mp > 10);
  const ip = g ? ipRaw : 0;

  // V13: the server (app.py) is the single source of truth — physical sun curve
  // for solar, guarded meter balance for battery. The client fabricates nothing.
  let pv = 0, ch = 0, dis = 0;
  const pvS = num(E.solP);
  if(Number.isFinite(pvS)) pv = pvS;
  const chS = num(E.chP);
  if(Number.isFinite(chS)) ch = chS;
  const disS = num(E.disP);
  if(Number.isFinite(disS)) dis = disS;

  let soc = num(E.soc);
  if(!Number.isFinite(soc)) soc = parseFloat(SETTINGS.battery_soc) || 85;
  const battA = num(E.battA);
  const amps = Number.isFinite(battA) ? battA : (ch > dis ? ch/13.5 : (dis > ch ? -dis/13.5 : 0));

  return { g, mp, ip, op, pv, ch, dis, soc, amps, ia: num(R.ia), oa: num(R.oa) };
}

// ============================ 4 · RENDER FUNCTIONS ============================
function setLine(id, active, reverse){
  const el = $(id);
  if(!el) return;
  el.classList.toggle("idle", !active);
  el.classList.toggle("rev", !!(reverse && active));
}

function renderHome(){
  const mp=RUN.mp, ip=RUN.ip, op=RUN.op, pv=RUN.pv, ch=RUN.ch, dis=RUN.dis, soc=RUN.soc;
  const ia=Number.isFinite(RUN.ia)?RUN.ia:NaN, oa=Number.isFinite(RUN.oa)?RUN.oa:NaN;
  const mv=Number.isFinite(num(R.mv))?num(R.mv):NaN;
  const amps=RUN.amps||0;
  const setV=(id,txt,fill)=>{const el=$(id);if(!el)return;el.textContent=txt;if(fill!==undefined)el.style.fill=fill;};
  const pkTxt=(w,t,unit,dec,sign)=> (Number.isFinite(w)&&w>0)
      ? (sign||"")+fmt(w,dec)+unit+((t&&t!=="--")?" @"+t:"")
      : "peak --";
  const ring=(id,col,active)=>{const el=$(id);if(!el)return;el.style.stroke=active?col:"#2c3648";el.style.strokeWidth=active?2.2:1.5;};

  // Top row: Main Grid (green=there / red=away) + today main kWh
  const mainOn = (Number.isFinite(mv)&&mv>120) || mp>10;
  const mainCol = mainOn ? "#34d399" : "#f87171";
  const ioM=$("ioMain"); if(ioM){ ioM.textContent = kw(mp); ioM.style.color = mainCol; }
  const mL=$("mainLbl"); if(mL) mL.style.color = mainCol;
  if($("ioToday")) $("ioToday").textContent = fmt(num(E.mainD)||0,1)+" kWh";

  // Animated flow pulses + active node rings
  setLine("fpGrid", ip>5);   ring("nGrid","#60a5fa", ip>5);
  setLine("fpSol", pv>5);    ring("nPv","#f5c451", pv>5);
  setLine("fpBat", (ch>5||dis>5), ch>=dis); ring("nBat", ch>=dis?"#34d399":"#f87171", ch>5||dis>5);
  setLine("fpLoad", op>5, true); ring("nLoad","#fb923c", op>5);

  // ---- TOP-LEFT · GRID (grid→inverter) ----
  setV("dGrid", kw(ip), ip>5?"#93c5fd":"#5b6780");
  setV("dGridA", Number.isFinite(ia)?fmt(ia,1)+"A":(ip>0?fmt(ip/230,1)+"A":"0A"));
  setV("dGridD", fmt(num(E.inD)||0,1)+" U today");
  setV("dGridP", pkTxt(num(E.pkInW), st(E.pkInT), "W", 0, ""));

  // ---- TOP-RIGHT · PV (physical sun curve — from server) ----
  setV("dPv", kw(pv), pv>5?"#f5c451":"#5b6780");
  setV("dPvA", pv>5?fmt(pv/13.5,1)+"A":"0A");
  setV("dPvD", fmt(num(E.solD)||0,1)+" U today");
  setV("dPvP", pkTxt(num(E.pvPeakD), st(E.pkPvT), "W", 0, ""));

  // ---- BOTTOM-LEFT · BATTERY (1–100%) ----
  setV("dBatt", fmt(soc,0)+"%", soc>=30?"#34d399":(soc>=15?"#f59e0b":"#f87171"));
  setV("dBattA", Math.abs(amps)>0.05 ? (ch>=dis?"+":"−")+fmt(Math.abs(amps),1)+"A" : "0A");
  const chSolU=num(E.bChSolD)||0, chGrU=num(E.bChGrD)||0;
  if($("dBattD")) $("dBattD").innerHTML = '<tspan fill="#f5c451">☀</tspan>'+fmt(chSolU,1)+' · <tspan>⚡</tspan>'+fmt(chGrU,1)+' U';
  const useCh = ch>=dis;
  let bpw = useCh?num(E.pkChW):num(E.pkDisW), bpt = useCh?st(E.pkChT):st(E.pkDisT), bsign = useCh?"+":"−";
  if(!(Number.isFinite(bpw)&&bpw>0)){
    const bw = useCh?num(E.pkDisW):num(E.pkChW), bt = useCh?st(E.pkDisT):st(E.pkChT);
    if(Number.isFinite(bw)&&bw>0){ bpw=bw; bpt=bt; bsign = useCh?"−":"+"; }
  }
  setV("dBattP", pkTxt(bpw, bpt, "A", 1, bsign));

  // ---- BOTTOM-RIGHT · LOAD ----
  setV("dLoad", kw(op), op>5?"#fdba74":"#5b6780");
  setV("dLoadA", Number.isFinite(oa)?fmt(oa,1)+"A":(op>0?fmt(op/230,1)+"A":"0A"));
  setV("dLoadD", fmt(num(E.outD)||0,1)+" U today");
  setV("dLoadP", pkTxt(num(E.pkOutW), st(E.pkOutT), "W", 0, ""));

  // Center: inverter icon + grid hours + cuts + own use
  const onH = num(E.onH)||8.5, offH = num(E.offH)||0.0;
  setV("gOnA", fmt(onH,1)+"h on");
  setV("gOnB", fmt(offH,1)+"h off");
  const cuts = num(E.outN);
  setV("gCuts", (Number.isFinite(cuts)&&cuts>0) ? cuts+"x cuts" : "no cuts",
        (Number.isFinite(cuts)&&cuts>0) ? "#fb923c" : "#34d399");
  const ownU = num(E.ownUse);
  setV("dOwn", "own use "+(Number.isFinite(ownU)?fmt(ownU,0):"--")+"W");
}

function renderAll(){
  RUN = computePower();
  renderHome();
}

// ============================ 5 · MODALS & TABS ============================
function openSettingsModal(){
  const m = $("setmodal");
  if(!m) return;
  m.classList.add("open");
}

function closeSettingsModal(){
  const m = $("setmodal");
  if(m) m.classList.remove("open");
}

function wireUI(){
  // Top bar buttons
  const bSet = $("btnSet");
  if(bSet) {
    bSet.onclick = openSettingsModal;
    bSet.ontouchstart = (e) => { e.preventDefault(); openSettingsModal(); };
  }

  const bSync = $("btnSync");
  if(bSync) {
    bSync.onclick = () => sync(true);
    bSync.ontouchstart = (e) => { e.preventDefault(); sync(true); };
  }

  // Modal close buttons
  const bSetClose = $("btnSetClose");
  if(bSetClose) bSetClose.onclick = closeSettingsModal;
  // SOC quick buttons: tap -> set battery %, counting starts from there
  document.querySelectorAll(".qSoc").forEach(btn => {
    btn.onclick = () => {
      const v = parseFloat(btn.getAttribute("data-v")) || 0;
      SETTINGS.battery_soc = v;
      localStorage.setItem("sako_user_settings", JSON.stringify(SETTINGS));
      fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ battery_soc: v })
      }).catch(()=>{});
      setSub("✓ Battery set " + v + "% — counting from here", "#34d399");
      closeSettingsModal();
      renderAll();
    };
  });

}

function tick(){
  try{
    const d = new Date();
    const cEl = $("clock");
    if(cEl) cEl.textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true });
  }catch(e){}
}

// Startup
document.addEventListener("DOMContentLoaded", () => {
  wireUI();
  tick();
  renderAll();
  sync();
  setInterval(tick, 1000);
  setInterval(sync, 4000);
});

// Immediate execution in case DOM is already loaded
wireUI();
tick();
renderAll();
sync();
setInterval(tick, 1000);
setInterval(sync, 4000);
</script>
